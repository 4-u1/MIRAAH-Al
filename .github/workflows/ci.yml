name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Test
        run: if npm run | grep -q "^  test$"; then npm test; else echo "no test script yet"; fi
      - name: Build
        run: npm run build
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high || true
