# Single-server deployment with SQLite. Put secrets in a .env file next to this file (never commit it):
#   ADMIN_EMAILS=you@example.com
#   PASSPORT_SIGNING_KEY=...        (node scripts/gen-signing-key.mjs)
#   GEMINI_API_KEY=...
# Then: docker compose up -d --build
services:
  miraah:
    build: .
    restart: unless-stopped
    init: true               # forward SIGTERM so the server closes the database cleanly
    stop_grace_period: 20s
    env_file: .env
    environment:
      AI_REQUIRE_AUTH: "true"
      TRUST_PROXY: "1"        # behind the reverse proxy below
      WORKSPACE_STORE: sqlite
    volumes:
      - miraah-data:/app/data
      - ./backups:/app/backups
    expose:
      - "8080"

  # HTTPS reverse proxy with automatic certificates. Set your domain in Caddyfile.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - miraah

volumes:
  miraah-data:
  caddy-data:
